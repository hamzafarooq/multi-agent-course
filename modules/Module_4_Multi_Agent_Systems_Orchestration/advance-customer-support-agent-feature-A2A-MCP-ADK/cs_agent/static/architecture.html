<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Agent Architecture</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --panel-2:#f1f3f6; --line:#e4e7ec;
    --text:#1a1d23; --muted:#6b7280; --accent:#0f9aae;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text)}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--panel)}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  header h1{font-size:15px;font-weight:600;margin:0}
  header nav{margin-left:auto;display:flex;gap:10px}
  header a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:5px 12px;font-size:13px}
  header a:hover{color:var(--text);border-color:var(--muted)}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 40px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .cap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px}
  .cap .live{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
  .cap .live i{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .cap .live.on i{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .lg{display:inline-flex;align-items:center;gap:6px}
  .sw{width:18px;height:10px;border-radius:3px;border:1.5px solid var(--muted)}
  .sw.d{border-style:dashed}
  .sw.on{border-color:var(--accent);background:#e7f7f9}
  .sw.x{border-color:#d9534f;background:#fdecea}
  #svg svg{display:block;width:100%;height:auto}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:24px 0 8px;font-weight:600}
  #log{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:300px;overflow:auto;padding:12px 16px}
  #log .row{display:flex;gap:12px;padding:2px 0}
  #log .t{color:var(--muted);flex:none}
  #log .k{flex:none;width:92px;color:var(--accent)}
  #log .k.x{color:#d9534f}
  #log .empty{color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>Customer Support Agent · Architecture</h1>
  <nav><a href="/" target="chat">Open chat</a><a href="http://localhost:6006" target="phoenix">Open Phoenix</a></nav>
</header>

<div class="wrap">
  <div class="card">
    <div class="cap">
      <span class="lg"><span class="sw"></span>in-process</span>
      <span class="lg"><span class="sw d"></span>separate service</span>
      <span class="lg"><span class="sw on"></span>running now</span>
      <span class="lg"><span class="sw x"></span>blocked</span>
      <span class="live" id="live"><i></i><span id="liveText">waiting for the chat tab</span></span>
    </div>
    <div id="svg"></div>
  </div>

  <h2>Live events</h2>
  <div class="card" id="log"><div class="empty">Send a message in the chat tab; each step appears here as it happens.</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
fetch('/architecture.svg').then(r=>r.text()).then(t=>{$('svg').innerHTML=t;});

const set=(ids,cls)=>ids.forEach(id=>{const e=$(id);if(!e)return;e.classList.remove('active','done','blocked');if(cls)e.classList.add(cls);});
const settle=()=>document.querySelectorAll('#svg .active').forEach(e=>{if(e.id!=='n-phoenix'&&e.id!=='e-trace'){e.classList.remove('active');e.classList.add('done');}});
const reset=()=>document.querySelectorAll('#svg .active,#svg .done,#svg .blocked').forEach(e=>e.classList.remove('active','done','blocked'));
const STAGES={sanitize:['e-user-san','n-sanitize'],judge:['e-san-judge','n-judge'],
              guardrail:['e-judge-guard','n-guardrail'],recall:['e-agent-mem0','n-mem0'],agent:['e-guard-agent','n-agent'],
              mask:['e-agent-mask','n-mask'],save:['e-agent-mem0','n-mem0']};
const BLOCK_NODE={sanitizer:'n-sanitize',judge:'n-judge',guardrail:'n-guardrail'};
const toolIds=name=>name==='search_memory'?['e-agent-mem0','n-mem0']:['e-agent-toolbox','n-toolbox','t-'+name,'e-toolbox-pg','n-pg'];

function light(e){
  if(e.type==='start'){reset();set(['n-user','n-phoenix','e-trace'],'active');return;}
  if(e.type==='stage'){
    const again=e.key==='agent'&&$('e-guard-agent')&&$('e-guard-agent').classList.contains('done');
    settle();
    if(e.key==='recall'||e.key==='save') set(['n-agent'],'active');
    set(again?['n-agent']:(STAGES[e.key]||[]),'active');return;
  }
  if(e.type==='tool_call'){set(['n-agent'],'active');set(toolIds(e.name),'active');return;}
  if(e.type==='tool_result'){set(toolIds(e.name),'done');return;}
  if(e.type==='final'){
    settle();
    if(e.blocked){set([BLOCK_NODE[e.stage]||'n-sanitize'],'blocked');set(['n-phoenix','e-trace'],'done');return;}
    set(['e-return','n-user'],'active');
    setTimeout(()=>{settle();set(['n-phoenix','e-trace'],'done');},1200);
    return;
  }
  if(e.type==='error'){settle();set(['n-phoenix','e-trace'],'done');}
}

const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const flat=(o,p='')=>Object.entries(o).flatMap(([k,v])=>
  v&&typeof v==='object'&&!Array.isArray(v)?flat(v,p+k+'.'):[`${p}${k}=${Array.isArray(v)?v.map(i=>i&&i.product?`${i.qty||1}× ${i.product}`:JSON.stringify(i)).join(' + '):v}`]);
function describe(e){
  if(e.type==='start') return ['request',e.message||''];
  if(e.type==='trace') return ['trace',`Phoenix trace ${e.trace_id}`];
  if(e.type==='stage') return ['stage',e.stage];
  if(e.type==='step') return [e.status==='passed'?'passed':'blocked',`${e.title}: ${e.detail}${e.memories&&e.memories.length?' → '+e.memories.map(m=>`"${m.memory}"`).join('; '):''} (${e.ms} ms, span ${e.span})`];
  if(e.type==='llm') return ['llm',`${e.model} ${e.detail}${e.tokens_in!=null?` (${e.tokens_in} in / ${e.tokens_out} out tokens)`:''}`];
  if(e.type==='tool_call') return ['tool call',`[${(e.info&&e.info.kind)||'tool'}${e.info&&e.info.access?' · '+e.info.access:''}] ${e.name}(${flat(e.args||{}).join(', ')})`];
  if(e.type==='tool_result') return ['tool result',`${e.name} → ${Array.isArray(e.result)?e.result.length+' rows':typeof e.result==='object'?'object':String(e.result).slice(0,80)}`];
  if(e.type==='final') return [e.blocked?'blocked':'response',e.blocked?`at ${e.stage}: ${e.response}`:(e.response||'').slice(0,140)];
  if(e.type==='error') return ['error',e.error];
  return [e.type,''];
}
function log(e){
  const box=$('log'); if(e.type==='start') box.innerHTML='';
  const [k,v]=describe(e);
  if(e.type==='stage') return;
  const row=document.createElement('div'); row.className='row';
  row.innerHTML=`<span class="t">${new Date().toLocaleTimeString()}</span><span class="k${k==='blocked'||k==='error'?' x':''}">${esc(k)}</span><span>${e.type==='trace'?`<a href="${esc(e.url)}" target="phoenix">${esc(v)} ↗</a>`:esc(v)}</span>`;
  box.appendChild(row); box.scrollTop=box.scrollHeight;
}

const ch=new BroadcastChannel('cs-agent');
ch.onmessage=({data})=>{
  $('live').classList.add('on'); $('liveText').textContent='connected to chat';
  light(data); log(data);
};
</script>
</body>
</html>
