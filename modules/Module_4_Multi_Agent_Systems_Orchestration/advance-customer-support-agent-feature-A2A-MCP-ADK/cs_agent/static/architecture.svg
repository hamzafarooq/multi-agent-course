<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" class="ax" role="img" aria-label="Customer support agent architecture">
<style>
  .ax{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --ax-bg:var(--panel,#fff);--ax-line:var(--line,#d6dbe2);--ax-text:var(--text,#1a1d23);
      --ax-muted:var(--muted,#6b7280);--ax-accent:var(--accent,#0f9aae)}
  .ax-node rect{fill:var(--ax-bg);stroke:var(--ax-line);stroke-width:1.5;transition:all .25s}
  .ax-node.svc rect.box{stroke-dasharray:6 4}
  .ax-title{font-size:13.5px;font-weight:600;fill:var(--ax-text)}
  .ax-sub{font-size:11px;fill:var(--ax-muted)}
  .ax-tag rect{fill:var(--ax-accent);stroke:none}
  .ax-tag text{font-size:9.5px;font-weight:700;fill:#fff;letter-spacing:.6px}
  .ax-chip rect{fill:var(--panel-2,#f1f3f6);stroke:var(--ax-line);stroke-width:1}
  .ax-chip text{font-size:9.5px;fill:var(--ax-text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .ax-edge{fill:none;stroke:var(--ax-line);stroke-width:1.6;marker-end:url(#ax-arrow);transition:stroke .25s}
  .ax-edge-label{font-size:10.5px;fill:var(--ax-muted)}
  .ax-trace{fill:none;stroke:var(--ax-line);stroke-width:1;stroke-dasharray:2 4}
  .ax-lane{font-size:10px;font-weight:700;letter-spacing:1px;fill:var(--ax-muted)}
  #ax-arrow path{fill:var(--ax-line)}
  #ax-arrow-on path{fill:var(--ax-accent)}

  .ax-node.active rect.box{stroke:var(--ax-accent);stroke-width:2.5;fill:#e7f7f9;filter:drop-shadow(0 0 8px rgba(15,154,174,.45))}
  .ax-node.done rect.box{stroke:var(--ax-accent);stroke-width:1.8}
  .ax-node.blocked rect.box{stroke:#d9534f;stroke-width:2.5;fill:#fdecea}
  .ax-chip.active rect{fill:var(--ax-accent);stroke:var(--ax-accent)}
  .ax-chip.active text{fill:#fff}
  .ax-chip.done rect{stroke:var(--ax-accent)}
  .ax-edge.active{stroke:var(--ax-accent);stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#ax-arrow-on);animation:ax-flow .6s linear infinite}
  .ax-edge.done{stroke:var(--ax-accent);marker-end:url(#ax-arrow-on)}
  .ax-trace.active{stroke:var(--ax-accent)}
  @keyframes ax-flow{to{stroke-dashoffset:-12}}
</style>
<defs>
  <marker id="ax-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ax-arrow-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<text class="ax-lane" x="200" y="48">REQUEST PIPELINE</text>
<text class="ax-lane" x="510" y="236">TOOLS &amp; MEMORY</text>

<path id="e-return" class="ax-edge" d="M1010,62 V30 H100 V58"/>
<text class="ax-edge-label" x="555" y="24" text-anchor="middle">masked response</text>

<path id="e-user-san" class="ax-edge" d="M170,98 H196"/>
<path id="e-san-judge" class="ax-edge" d="M350,98 H376"/>
<path id="e-judge-guard" class="ax-edge" d="M530,98 H556"/>
<path id="e-guard-agent" class="ax-edge" d="M710,98 H736"/>
<path id="e-agent-mask" class="ax-edge" d="M900,98 H926"/>
<path id="e-agent-toolbox" class="ax-edge" d="M820,138 V226"/>
<text class="ax-edge-label" x="828" y="190">MCP</text>
<path id="e-toolbox-pg" class="ax-edge" d="M704,282 H664"/>
<text class="ax-edge-label" x="684" y="274" text-anchor="middle">SQL</text>
<path id="e-agent-mem0" class="ax-edge" d="M880,138 L990,226"/>
<text class="ax-edge-label" x="948" y="178">memory</text>

<g id="n-user" class="ax-node">
  <rect class="box" x="20" y="58" width="150" height="80" rx="12"/>
  <text class="ax-title" x="95" y="92" text-anchor="middle">User</text>
  <text class="ax-sub" x="95" y="110" text-anchor="middle">web UI · :8000</text>
</g>

<g id="n-sanitize" class="ax-node">
  <rect class="box" x="200" y="58" width="150" height="80" rx="12"/>
  <text class="ax-title" x="275" y="88" text-anchor="middle">Sanitizer</text>
  <text class="ax-sub" x="275" y="106" text-anchor="middle">regex blocker</text>
  <text class="ax-sub" x="275" y="121" text-anchor="middle">in-process · layer 1</text>
</g>

<g id="n-judge" class="ax-node svc">
  <rect class="box" x="380" y="58" width="150" height="80" rx="12"/>
  <g class="ax-tag"><rect x="496" y="50" width="30" height="16" rx="8"/><text x="511" y="61.5" text-anchor="middle">A2A</text></g>
  <text class="ax-title" x="455" y="88" text-anchor="middle">Security Judge</text>
  <text class="ax-sub" x="455" y="106" text-anchor="middle">ADK agent · :10002</text>
  <text class="ax-sub" x="455" y="121" text-anchor="middle">layer 2 · injection check</text>
</g>

<g id="n-guardrail" class="ax-node">
  <rect class="box" x="560" y="58" width="150" height="80" rx="12"/>
  <text class="ax-title" x="635" y="88" text-anchor="middle">Guardrail</text>
  <text class="ax-sub" x="635" y="106" text-anchor="middle">ADK agent · in-process</text>
  <text class="ax-sub" x="635" y="121" text-anchor="middle">layer 3 · safe &amp; on-topic</text>
</g>

<g id="n-agent" class="ax-node">
  <rect class="box" x="740" y="58" width="160" height="80" rx="12"/>
  <text class="ax-title" x="820" y="88" text-anchor="middle">Support Agent</text>
  <text class="ax-sub" x="820" y="106" text-anchor="middle">Google ADK LlmAgent</text>
  <text class="ax-sub" x="820" y="121" text-anchor="middle">gemini-2.5-flash</text>
</g>

<g id="n-mask" class="ax-node svc">
  <rect class="box" x="930" y="58" width="150" height="80" rx="12"/>
  <g class="ax-tag"><rect x="1046" y="50" width="30" height="16" rx="8"/><text x="1061" y="61.5" text-anchor="middle">A2A</text></g>
  <text class="ax-title" x="1005" y="88" text-anchor="middle">Data Masker</text>
  <text class="ax-sub" x="1005" y="106" text-anchor="middle">ADK agent · :10003</text>
  <text class="ax-sub" x="1005" y="121" text-anchor="middle">layer 4 · PII scrub</text>
</g>

<g id="n-pg" class="ax-node svc">
  <rect class="box" x="510" y="246" width="150" height="72" rx="12"/>
  <text class="ax-title" x="585" y="276" text-anchor="middle">PostgreSQL</text>
  <text class="ax-sub" x="585" y="294" text-anchor="middle">users · orders · actions</text>
</g>

<g id="n-toolbox" class="ax-node svc">
  <rect class="box" x="704" y="230" width="232" height="106" rx="12"/>
  <text class="ax-title" x="820" y="252" text-anchor="middle">MCP Toolbox · :5000</text>
  <g id="t-get-order-status" class="ax-chip"><rect x="710" y="262" width="108" height="22" rx="6"/><text x="764" y="277" text-anchor="middle">get-order-status</text></g>
  <g id="t-find-customer-orders" class="ax-chip"><rect x="822" y="262" width="108" height="22" rx="6"/><text x="876" y="277" text-anchor="middle">find-orders</text></g>
  <g id="t-update-order-status" class="ax-chip"><rect x="710" y="290" width="108" height="22" rx="6"/><text x="764" y="305" text-anchor="middle">update-status</text></g>
  <g id="t-action-log" class="ax-chip"><rect x="822" y="290" width="108" height="22" rx="6"/><text x="876" y="305" text-anchor="middle">action-log</text></g>
</g>

<g id="n-mem0" class="ax-node svc">
  <rect class="box" x="950" y="230" width="130" height="72" rx="12"/>
  <text class="ax-title" x="1015" y="260" text-anchor="middle">Mem0</text>
  <text class="ax-sub" x="1015" y="278" text-anchor="middle">recall · save</text>
</g>

<path id="e-trace" class="ax-trace" d="M95,138 V362 M275,138 V362 M455,138 V362 M1015,302 V362"/>
<g id="n-phoenix" class="ax-node svc">
  <rect class="box" x="20" y="362" width="1060" height="38" rx="10"/>
  <text class="ax-title" x="40" y="386">Arize Phoenix · :6006</text>
  <text class="ax-sub" x="196" y="386">OpenTelemetry spans from every step: each guardrail layer, the agent turn, each tool call, each Gemini call</text>
</g>
</svg>
